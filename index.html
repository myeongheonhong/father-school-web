<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f5f7f3">
  <meta name="description" content="아버지학교 이름표 QR코드 연결 확인용 테스트 페이지입니다.">
  <title>아버지학교 · QR 연결 테스트</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:#f5f7f3;color:#243d30;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;letter-spacing:-.04em;display:flex;align-items:center;justify-content:center;padding:28px 22px}main{width:100%;max-width:440px}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:750;margin-bottom:48px}.brand svg{width:32px;height:32px;stroke:#2b674d;fill:none;stroke-width:1.6}.label{font-size:13px;color:#35654c;font-weight:650;letter-spacing:.01em;margin:0 0 13px}h1{font-size:clamp(30px,8vw,38px);line-height:1.35;margin:0 0 20px;font-weight:750;letter-spacing:-.065em}.intro{font-size:17px;line-height:1.85;color:#5c6d61;margin:0 0 32px;word-break:keep-all}.status{display:flex;align-items:center;gap:13px;border:1px solid #d4e1d6;background:#fff;border-radius:15px;padding:20px}.check{width:34px;height:34px;border-radius:50%;background:#e9f2eb;display:grid;place-items:center;flex-shrink:0}.check svg{width:20px;height:20px;stroke:#286447;stroke-width:2;fill:none}.status strong{display:block;font-size:17px}.status p{margin:4px 0 0;color:#65746b;font-size:14px}.next{padding:25px 0;font-size:14px;line-height:1.9;color:#65746b;word-break:keep-all}footer{border-top:1px solid #dce3da;padding-top:19px;color:#748177;font-size:12px;line-height:1.7}footer span{display:inline-block;padding:2px 7px;background:#e9eee6;border-radius:4px;margin-right:5px;color:#50604e}
  </style>
</head>
<body>
  <main>
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14"/><path d="M16 7v18M10 13h12"/></svg>아버지학교</div>
    <p class="label">QR코드 연결 테스트</p>
    <h1>반갑습니다.<br>잘 찾아오셨어요.</h1>
    <p class="intro">이 페이지는 이름표에 인쇄할 QR코드가<br>정상적으로 연결되는지 확인하는<br>테스트 페이지입니다.</p>
    <section class="status" aria-label="페이지 연결 상태">
      <span class="check"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></span>
      <div><strong>정상적으로 연결되었습니다.</strong><p>아버지학교 홈페이지를 준비하고 있어요.</p></div>
    </section>
    <p class="next">준비가 끝나면 이 주소에서<br>1–3주차 사진과 조별 안내를 확인하실 수 있습니다.</p>
    <footer><span>TEST</span>아버지학교 · QR 연결 확인용 페이지</footer>
  </main>
</body>
</html>
